<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 Gửi Công Chúa Của Anh 💖</title>
    <style>
        /* --- CSS STYLE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng bong bóng trái tim */
        .heart-bubble {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            bottom: -50px;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        /* Hộp quà bí mật */
        .gift-container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 10;
        }

        .gift-container:hover {
            transform: scale(1.05);
        }

        .gift-box {
            font-size: 100px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .gift-text {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ff4d6d;
            font-weight: bold;
            background: white;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Thiệp chúc mừng (Ẩn lúc đầu) */
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 2px solid #ff85a1;
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease-in-out;
            z-index: 10;
        }

        .card.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .card h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff85a1;
            margin-bottom: 20px;
        }

        /* Hiệu ứng chữ gõ */
        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #4a4a4a;
            min-height: 120px;
            margin-bottom: 20px;
            text-align: justify;
        }

        .btn-love {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }

        .btn-love:hover {
            background: #ff758f;
        }
    </style>
</head>
<body>

    <!-- Màn hình 1: Hộp quà bí mật -->
    <div class="gift-container" id="giftContainer" onclick="openGift()">
        <div class="gift-box">🎁</div>
        <div class="gift-text">Bấm vào đây để nhận quà 20/10 nhé! 💖</div>
    </div>

    <!-- Màn hình 2: Thiệp chúc mừng -->
    <div class="card" id="loveCard">
        <img src="https://unsplash.com" alt="Love">
        <h1>Happy Vietnamese Women's Day! 🌸</h1>
        <div class="message" id="typingText"></div>
        <button class="btn-love" onclick="loveAction()">Bấm vào đi 😘</button>
    </div>

    <script>
        /* --- JAVASCRIPT CODE --- */
        
        // 1. Tạo hiệu ứng bong bóng trái tim bay ngẫu nhiên
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bubble');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's'; // từ 3s - 5s
            heart.style.fontSize = Math.random() * 15 + 15 + 'px'; // kích thước ngẫu nhiên
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 300);

        // Lời chúc bạn muốn gửi (Bạn có thể thay đổi nội dung này)
        const greetingText = "Chúc mừng Trương Bảo Thy ngày 20/10";
        
        let index = 0;

        // 2. Hàm chạy chữ gõ máy (Typing Effect)
        function typeMessage() {
            if (index < greetingText.length) {
                document.getElementById("typingText").innerHTML += greetingText.charAt(index);
                index++;
                setTimeout(typeMessage, 50); // Tốc độ gõ chữ (ms)
            }
        }

        // 3. Hàm kích hoạt khi mở hộp quà
        function openGift() {
            const giftContainer = document.getElementById('giftContainer');
            const loveCard = document.getElementById('loveCard');

            // Ẩn hộp quà
            giftContainer.style.display = 'none';

            // Hiển thị thiệp
            loveCard.style.display = 'block';
            setTimeout(() => {
                loveCard.classList.add('show');
                typeMessage(); // Bắt đầu gõ chữ khi thiệp mở ra
            }, 100);
        }

        // 4. Hành động khi ấn nút "Yêu Anh Nhìu"
        function loveAction() {
            alert("6h chiều nay có bất ngờ 🥰❤️");
            // Bạn có thể đổi hiệu ứng hoặc chuyển sang link bài hát nếu muốn
        }
    </script>
</body>
</html>
